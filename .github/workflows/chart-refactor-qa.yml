name: Chart refactor and security QA
on:
  pull_request:
    paths:
      - 'bootstrap.js'
      - 'stable-layout.css'
      - 'chart-components.js'
      - 'brand-operations.js'
      - 'v770-remote-sync.js'
      - 'safe-upload-core.js'
      - 'local-excel-import.js'
      - 'app.js'
      - 'backend/Code.gs'
      - 'tests/chart-refactor.spec.cjs'
      - 'tests/chart-debug.cjs'
      - 'tests/chart-visual-gate.cjs'
      - 'tests/mobile-layout-metrics.spec.cjs'
      - 'tests/category-label-stress.spec.cjs'
      - 'tests/security-release-gate.cjs'
      - 'tests/safe-upload-core.spec.cjs'
      - 'tests/backend-quarantine.spec.cjs'
      - 'tests/local-excel-import.spec.cjs'
      - 'tests/local-excel-row-number.spec.cjs'
      - 'tests/local-excel-liter-format.spec.cjs'
      - 'tests/local-excel-schema.spec.cjs'
      - 'tests/local-excel-validation-rollback.spec.cjs'
      - '.github/workflows/chart-refactor-qa.yml'
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check bootstrap.js
          node --check chart-components.js
          node --check brand-operations.js
          node --check safe-upload-core.js
          node --check local-excel-import.js
          node --check tests/safe-upload-core.spec.cjs
          node --check tests/backend-quarantine.spec.cjs
          node --check tests/local-excel-import.spec.cjs
          node --check tests/local-excel-row-number.spec.cjs
          node --check tests/local-excel-liter-format.spec.cjs
          node --check tests/local-excel-schema.spec.cjs
          node --check tests/local-excel-validation-rollback.spec.cjs
          node --check tests/chart-refactor.spec.cjs
          node --check tests/chart-debug.cjs
          node --check tests/chart-visual-gate.cjs
          node --check tests/mobile-layout-metrics.spec.cjs
          node --check tests/category-label-stress.spec.cjs
          node --check tests/security-release-gate.cjs
      - name: Offline backend quarantine behavioral regression (no network)
        run: node tests/backend-quarantine.spec.cjs
      - name: Mock-only upload transaction regression (no network)
        run: node tests/safe-upload-core.spec.cjs
      - name: Offline local Excel preview interception and rollback regression
        run: node tests/local-excel-import.spec.cjs
      - name: Offline Excel original row number regression
        run: node tests/local-excel-row-number.spec.cjs
      - name: Offline Excel liter format regression
        run: node tests/local-excel-liter-format.spec.cjs
      - name: Offline Excel schema and malformed rows regression
        run: node tests/local-excel-schema.spec.cjs
      - name: Offline Excel validation and rendering rollback regression
        run: node tests/local-excel-validation-rollback.spec.cjs
      - name: Install isolated browser test dependencies
        run: npm install --no-save --no-package-lock playwright@1.55.0 chart.js@4.4.7 chartjs-plugin-datalabels@2.2.0 xlsx@0.18.5
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Serve repository locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/fuel-http.log 2>&1 &
          echo $! > /tmp/fuel-http.pid
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/index.html > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture first chart exception
        run: node tests/chart-debug.cjs
      - name: Desktop and Android-sized browser regression
        run: node tests/chart-refactor.spec.cjs
      - name: Settled chart geometry and screenshot gate
        run: node tests/chart-visual-gate.cjs
      - name: Mobile dashboard layout metrics (360px and 390px)
        run: node tests/mobile-layout-metrics.spec.cjs
      - name: Synthetic long category label stress (mock only)
        run: node tests/category-label-stress.spec.cjs
      - name: Security release gate (must pass before merge)
        run: node tests/security-release-gate.cjs
      - name: Screenshots and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-refactor-screenshots
          path: test-results/chart-refactor/
          if-no-files-found: warn
          retention-days: 14
